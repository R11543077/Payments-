<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="買房記帳">
<link rel="manifest" href="manifest.webmanifest">
<title>買房記帳</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC",sans-serif;color:#1c1c1e;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#f5f5f7}
main{max-width:720px;margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 12px}.muted{color:#6e6e73;font-size:13px}
.card{background:#fff;border:1px solid #e5e5ea;border-radius:18px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:#6e6e73}input,select,button{font:inherit}
input,select{width:100%;margin-top:6px;padding:12px;border:1px solid #d1d1d6;border-radius:12px;background:#fff;font-size:16px}
button{border:0;border-radius:12px;padding:11px 15px;min-height:44px;background:#1c1c1e;color:#fff;font-weight:600}
button.secondary{background:#eeeef0;color:#1c1c1e}button.danger{background:#fff0f0;color:#b42318}
.actions{display:flex;gap:8px;flex-wrap:wrap}.amount{font-size:24px;font-weight:750}.settle{font-size:20px;font-weight:750;line-height:1.45}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.item{font-weight:650}.right{text-align:right;white-space:nowrap}
.empty{text-align:center;color:#8e8e93;padding:22px 0}.install{background:#f0f7ff;border-color:#cfe5ff}
@media(max-width:520px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}main{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<main>
  <div class="top"><div><h1>🏠 買房記帳</h1><div class="muted">兩人共同買房支出管理</div></div><button id="reset" class="secondary">清除資料</button></div>

  <section class="card install">
    <b>📱 加入 iPhone 主畫面</b>
    <div class="muted" style="margin:6px 0 10px">Safari 開啟後按「分享」→「加入主畫面」，之後就能像 App 一樣使用。</div>
  </section>

  <section class="card">
    <h2>兩位共同購屋人</h2>
    <div class="grid">
      <label>第一位<input id="p1" placeholder="例如：宸曜"></label>
      <label>第二位<input id="p2" placeholder="例如：小明"></label>
    </div>
    <div style="margin-top:14px">
      <label>分攤比例：<span id="splitText"></span></label>
      <input id="split" type="range" min="0" max="100" value="50" style="padding:0;margin-top:10px">
    </div>
  </section>

  <section class="card">
    <h2>新增支出</h2>
    <form id="form">
      <div class="grid">
        <label>日期<input id="date" type="date" required></label>
        <label>項目<input id="item" placeholder="頭期款／契稅／裝潢／家具" required></label>
        <label>付款人<select id="payer"><option value="1">第一位</option><option value="2">第二位</option></select></label>
        <label>金額<input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="0" required></label>
      </div>
      <button style="margin-top:12px;width:100%">＋ 新增支出</button>
    </form>
  </section>

  <section class="summary">
    <div class="card"><div class="muted" id="n1">第一位</div><div class="amount" id="paid1">NT$0</div><div class="muted" id="share1">應負擔 NT$0</div></div>
    <div class="card"><div class="muted" id="n2">第二位</div><div class="amount" id="paid2">NT$0</div><div class="muted" id="share2">應負擔 NT$0</div></div>
  </section>

  <section class="card">
    <div class="muted">目前結算</div>
    <div class="settle" id="settlement">尚無支出</div>
    <div class="muted" id="total" style="margin-top:6px">總支出 NT$0</div>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>支出明細</h2><span class="muted" id="count"></span></div>
    <div id="list"></div>
  </section>
</main>
<script>
const KEY="home-purchase-ledger-v1";
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{p1:"",p2:"",split:50,entries:[]};
const $=id=>document.getElementById(id);
const money=n=>"NT$"+Math.round(n).toLocaleString("zh-TW");
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
$("date").value=today();

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){
  $("p1").value=state.p1;$("p2").value=state.p2;$("split").value=state.split;
  const a=state.p1||"第一位",b=state.p2||"第二位",s=state.split/100;
  $("n1").textContent=a;$("n2").textContent=b;
  $("splitText").textContent=`${a} ${state.split}% / ${b} ${100-state.split}%`;
  const total=state.entries.reduce((x,e)=>x+e.amount,0);
  const paid1=state.entries.filter(e=>e.payer===1).reduce((x,e)=>x+e.amount,0);
  const paid2=total-paid1, share1=total*s, share2=total-share1;
  $("paid1").textContent=money(paid1);$("paid2").textContent=money(paid2);
  $("share1").textContent="應負擔 "+money(share1);$("share2").textContent="應負擔 "+money(share2);
  $("total").textContent="總支出 "+money(total);$("count").textContent=state.entries.length+" 筆";
  const diff=paid1-share1;
  if(!state.entries.length)$("settlement").textContent="尚無支出";
  else if(Math.abs(diff)<0.5)$("settlement").textContent="目前已平衡，不需要補款";
  else if(diff>0)$("settlement").textContent=`${b} → ${a}　${money(diff)}`;
  else $("settlement").textContent=`${a} → ${b}　${money(-diff)}`;
  const list=$("list");list.innerHTML="";
  if(!state.entries.length){list.innerHTML='<div class="empty">還沒有支出紀錄</div>';return}
  [...state.entries].reverse().forEach((e,rev)=>{
    const i=state.entries.length-1-rev, name=e.payer===1?a:b;
    const row=document.createElement("div");row.className="row";
    row.innerHTML=`<div class="grow"><div class="item">${esc(e.item)}</div><div class="muted">${esc(e.date)} · ${esc(name)}</div></div><div class="right"><b>${money(e.amount)}</b></div><button class="danger" data-del="${i}" aria-label="刪除">刪除</button>`;
    list.appendChild(row);
  });
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

$("form").addEventListener("submit",e=>{
 e.preventDefault();const amount=Number($("amount").value);
 if(!Number.isFinite(amount)||amount<=0)return;
 state.entries.push({date:$("date").value,item:$("item").value.trim(),payer:Number($("payer").value),amount});
 $("item").value="";$("amount").value="";save();render();
});
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b)return;state.entries.splice(Number(b.dataset.del),1);save();render()});
$("p1").addEventListener("input",e=>{state.p1=e.target.value;save();render()});
$("p2").addEventListener("input",e=>{state.p2=e.target.value;save();render()});
$("split").addEventListener("input",e=>{state.split=Number(e.target.value);save();render()});
$("reset").addEventListener("click",()=>{if(confirm("確定要刪除全部買房記帳資料嗎？")){state={p1:"",p2:"",split:50,entries:[]};save();render()}});

if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script>
</body>
</html>
